plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.0.0'
}

group = 'com.corruptedstudio'
version = '1.0.1'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://jitpack.io' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.2-R0.1-SNAPSHOT'
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7.1'
    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
}

java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }

processResources { filesMatching('plugin.yml') { expand(version: project.version) } }

shadowJar {
    archiveClassifier.set('')
    relocate 'org.sqlite', 'com.corruptedstudio.activityafk.libs.sqlite'
}

tasks.build { dependsOn tasks.shadowJar }
jar { enabled = false }
